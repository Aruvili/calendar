name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Formatting & Repo Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

  web-ci:
    name: Web Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint web application
        working-directory: ./web
        run: npm run lint

      - name: Build web application
        working-directory: ./web
        run: npm run build

  api-ci:
    name: API Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Cargo fmt check
        run: cargo fmt --manifest-path api/Cargo.toml -- --check

      - name: Cargo Clippy
        run: cargo clippy --manifest-path api/Cargo.toml -- -D warnings

      - name: Cargo Test
        run: cargo test --manifest-path api/Cargo.toml

  app-ci:
    name: Client App (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install flutter dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Analyze Flutter codebase
        working-directory: ./app
        run: flutter analyze
