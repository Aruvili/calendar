name: Bug Report
description: Report an issue or unexpected behavior in the Calendar repo
title: '[BUG]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug!
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is failing?
      options:
        - Web (Next.js)
        - API (Rust Actix)
        - App (Flutter)
        - Database (Postgres/Redis)
        - CI / Tooling
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
